name: Build RJ Furz-App IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml

      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint App/Info.plist
          test -f App/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          find App -name '*.swift' | sort

      - name: Build unsigned app
        id: build
        shell: bash
        run: |
          set -o pipefail
          rm -rf .github-derived

          xcodebuild \
            -project RJFurzApp.xcodeproj \
            -scheme RJFurzApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.github-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee RJ-FurzApp-build.log

      - name: Create unsigned IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APP="$(find "$PWD/.github-derived/Build/Products/Release-iphoneos" \
            -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$APP"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/

          /usr/bin/zip -qry RJ-FurzApp-unsigned.ipa Payload
          unzip -t RJ-FurzApp-unsigned.ipa
          ls -lh RJ-FurzApp-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-FurzApp-unsigned-IPA
          path: RJ-FurzApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-FurzApp-build-log
          path: RJ-FurzApp-build.log
          if-no-files-found: ignore
          retention-days: 7
