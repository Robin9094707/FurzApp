name: Apply and Build RJ Furz-App 2.2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated 2.2 source update
        shell: bash
        run: |
          set -euo pipefail
          cat .update22/patch00 .update22/patch01 .update22/patch02 .update22/patch03 .update22/patch04 .update22/patch05 > /tmp/rj22.patch
          git apply --check /tmp/rj22.patch
          git apply /tmp/rj22.patch

          python3 <<'PY'
          from pathlib import Path
          W=H=1024
          pix=bytearray(W*H*3)
          def setp(x,y,c):
              if 0<=x<W and 0<=y<H:
                  i=(y*W+x)*3; pix[i:i+3]=bytes(c)
          for y in range(H):
              for x in range(W):
                  t=(x+y)/(W+H-2)
                  setp(x,y,(int(69+(153-69)*t),int(36+(66-36)*t),int(105+(181-105)*t)))
          def circle(cx,cy,r,c):
              rr=r*r
              for y in range(max(0,cy-r),min(H,cy+r+1)):
                  span=int(max(0,rr-(y-cy)*(y-cy))**0.5)
                  for x in range(max(0,cx-span),min(W,cx+span+1)): setp(x,y,c)
          def line(x1,y,x2,w,c):
              for yy in range(y-w//2,y+w//2+1):
                  for x in range(x1,x2+1): setp(x,yy,c)
              circle(x1,y,w//2,c); circle(x2,y,w//2,c)
          white=(255,249,241); accent=(111,45,166)
          circle(500,505,180,white); circle(405,455,125,white); circle(590,405,145,white); circle(660,520,125,white)
          line(215,455,385,54,white); line(180,565,400,54,white); line(230,675,455,54,white)
          circle(535,445,38,accent); circle(620,395,31,accent); circle(535,452,22,white); circle(620,402,18,white)
          Path('/tmp/rj-wind-icon.ppm').write_bytes(f'P6\n{W} {H}\n255\n'.encode()+pix)
          PY
          sips -s format png /tmp/rj-wind-icon.ppm --out App/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png >/dev/null
          rm -rf Backend/__pycache__

      - name: Validate complete source
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint App/Info.plist Widget/Info.plist App/RJFurzApp.entitlements Widget/RJFurzWidget.entitlements
          python3 -m py_compile Backend/rj_furz_backend.py
          rm -rf Backend/__pycache__
          test -s App/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          test "$(sips -g pixelWidth App/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png | awk '/pixelWidth/{print $2}')" = 1024
          swiftc -parse $(find App Shared Widget -name '*.swift' -print)
          grep -q 'counter.v3' Widget/RJFurzWidgets.swift
          grep -q 'OpenQuickFartRecorderIntent' Widget/RJFurzWidgets.swift
          grep -q 'MARKETING_VERSION: "2.2"' project.yml

      - name: Promote clean readable 2.2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project.yml Shared Widget App Backend
          git rm -r .update22
          if ! git diff --cached --quiet; then
            git commit -m 'RJ Furz-App 2.2 widgets friends audio and recorder update [skip ci]'
            git push origin HEAD:main
          fi

      - name: Select Xcode 26.5 and generate project
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Build app and widget
        shell: bash
        run: |
          set -o pipefail
          rm -rf .github-derived RJ-FurzApp-2.2-build.log
          xcodebuild \
            -project RJFurzApp.xcodeproj \
            -scheme RJFurzApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.github-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee RJ-FurzApp-2.2-build.log

      - name: Package and verify IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$PWD/.github-derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$APP"
          APPEX="$(find "$APP/PlugIns" -maxdepth 1 -name '*.appex' -type d -print -quit)"
          test -n "$APPEX"
          test -f "$APPEX/Info.plist"
          find "$APPEX" -iname '*appintent*' -o -iname 'Metadata.appintents' | head -20
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry RJ-FurzApp-2.2-unsigned.ipa Payload
          unzip -t RJ-FurzApp-2.2-unsigned.ipa
          unzip -l RJ-FurzApp-2.2-unsigned.ipa | grep -E 'PlugIns/.+\.appex/' | head
          shasum -a 256 RJ-FurzApp-2.2-unsigned.ipa

      - name: Upload verified IPA
        uses: actions/upload-artifact@v4
        with:
          name: RJ-FurzApp-2.2-unsigned-IPA
          path: RJ-FurzApp-2.2-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload compiler log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-FurzApp-2.2-build-log
          path: RJ-FurzApp-2.2-build.log
          if-no-files-found: ignore
          retention-days: 7
