name: Build RJ Furz-App 2.2.1 Recorder Hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply recorder hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 .fix221/apply_fix.py

      - name: Validate hotfix source
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse $(find App Shared Widget -name '*.swift' -print)
          plutil -lint App/Info.plist Widget/Info.plist App/RJFurzApp.entitlements Widget/RJFurzWidget.entitlements
          grep -q 'measuredDuration' App/CoreServices.swift
          grep -q 'QuickRecordRequest.consumeIfRecent' App/EditorRecorderViews.swift
          grep -q 'QuickRecordRequest.hasRecent' App/MainViews.swift
          grep -q 'MARKETING_VERSION: "2.2.1"' project.yml

      - name: Promote readable hotfix source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App/CoreServices.swift App/EditorRecorderViews.swift App/MainViews.swift Shared/RJFurzShared.swift project.yml
          if ! git diff --cached --quiet; then
            git commit -m 'RJ Furz-App 2.2.1 recorder and cold-launch fix [skip ci]'
            git push origin HEAD:main
          fi

      - name: Select Xcode 26.5 and generate project
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Build app and widget
        shell: bash
        run: |
          set -o pipefail
          rm -rf .github-derived RJ-FurzApp-2.2.1-build.log
          xcodebuild \
            -project RJFurzApp.xcodeproj \
            -scheme RJFurzApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.github-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee RJ-FurzApp-2.2.1-build.log

      - name: Package and verify IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$PWD/.github-derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$APP"
          APPEX="$(find "$APP/PlugIns" -maxdepth 1 -name '*.appex' -type d -print -quit)"
          test -n "$APPEX"
          test -f "$APPEX/Info.plist"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry RJ-FurzApp-2.2.1-unsigned.ipa Payload
          unzip -t RJ-FurzApp-2.2.1-unsigned.ipa
          unzip -l RJ-FurzApp-2.2.1-unsigned.ipa | grep -E 'PlugIns/.+\.appex/' | head
          shasum -a 256 RJ-FurzApp-2.2.1-unsigned.ipa

      - name: Upload verified IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-FurzApp-2.2.1-unsigned-IPA
          path: RJ-FurzApp-2.2.1-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload compiler log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-FurzApp-2.2.1-build-log
          path: RJ-FurzApp-2.2.1-build.log
          if-no-files-found: ignore
          retention-days: 7
