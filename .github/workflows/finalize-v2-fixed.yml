name: Finalize RJ Furz-App v2 Fixed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve current workflow files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rj-workflows
          mkdir -p /tmp/rj-workflows
          cp -R .github/workflows/. /tmp/rj-workflows/

      - name: Reconstruct clean v2 source when needed
        shell: bash
        run: |
          set -euo pipefail
          if [ -s .bootstrap/part00 ]; then
            python3 <<'PY'
          from pathlib import Path
          import base64, hashlib, tarfile, shutil

          first = b''.join(Path(f'.bootstrap/part{i:02d}').read_bytes() for i in range(7))
          first_binary = base64.b64decode(b''.join(first.split()), validate=True)
          later_binary = b''.join(Path(f'.bootstrap/part{i:02d}').read_bytes() for i in range(7, 15))
          payload = first_binary + later_binary
          expected = '317549e0193dcb9d310b575f322b195522ad4b7c65c6f65f940cdafc2132a795'
          digest = hashlib.sha256(payload).hexdigest()
          print('payload bytes:', len(payload))
          print('sha256:', digest)
          if digest != expected:
              raise SystemExit(f'payload SHA mismatch: {digest}')

          src = Path('/tmp/rjfurz-v2.tar')
          src.write_bytes(payload)
          if not tarfile.is_tarfile(src):
              raise SystemExit('reconstructed payload is not a tar archive')
          out = Path('/tmp/rjfurz-v2-extract')
          shutil.rmtree(out, ignore_errors=True)
          out.mkdir()
          with tarfile.open(src, 'r:*') as tf:
              tf.extractall(out, filter='data')
          candidates = sorted(out.rglob('project.yml'), key=lambda p: len(p.parts))
          if not candidates:
              raise SystemExit('project.yml missing after extraction')
          Path('/tmp/rjfurz-v2-root').write_text(str(candidates[0].parent))
          PY

            ROOT="$(cat /tmp/rjfurz-v2-root)"
            rsync -a --delete --exclude='.git' "$ROOT/" "$GITHUB_WORKSPACE/"
            rm -rf .github/workflows
            mkdir -p .github/workflows
            cp -R /tmp/rj-workflows/. .github/workflows/
            rm -rf .bootstrap Backend/__pycache__ dist
            echo "Restored source root: $ROOT"
          else
            echo 'Clean v2 source already promoted; using repository source.'
          fi

          python3 <<'PY'
          from pathlib import Path
          p = Path('Shared/RJFurzShared.swift')
          s = p.read_text()
          obsolete = '    public static var allowedExecutionTargets: ExecutionTargets { .main }\n'
          if obsolete in s:
              p.write_text(s.replace(obsolete, ''))
              print('Removed obsolete ExecutionTargets AppIntent declaration.')
          else:
              print('ExecutionTargets compatibility fix already present.')
          PY

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint App/Info.plist
          plutil -lint Widget/Info.plist
          plutil -lint App/RJFurzApp.entitlements
          plutil -lint Widget/RJFurzWidget.entitlements
          test -f App/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          python3 -m py_compile Backend/rj_furz_backend.py
          rm -rf Backend/__pycache__
          test -f Widget/RJFurzWidgets.swift
          test -f App/AlarmService.swift
          test -f App/LocationViews.swift
          test -f App/PartnerViews.swift

      - name: Select Xcode and install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          brew install xcodegen
          xcodegen --version
          xcodegen generate --spec project.yml

      - name: Build unsigned app and widget
        shell: bash
        run: |
          set -o pipefail
          rm -rf .github-derived RJ-FurzApp-v2-build.log
          xcodebuild \
            -project RJFurzApp.xcodeproj \
            -scheme RJFurzApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.github-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee RJ-FurzApp-v2-build.log

      - name: Package and verify v2 IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$PWD/.github-derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$APP"
          test -d "$APP/PlugIns"
          APPEX_COUNT="$(find "$APP/PlugIns" -maxdepth 1 -name '*.appex' -type d | wc -l | tr -d ' ')"
          test "$APPEX_COUNT" -ge 1
          echo "Embedded widget extensions: $APPEX_COUNT"
          find "$APP/PlugIns" -maxdepth 1 -name '*.appex' -type d -print
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry RJ-FurzApp-v2-unsigned.ipa Payload
          unzip -t RJ-FurzApp-v2-unsigned.ipa
          unzip -l RJ-FurzApp-v2-unsigned.ipa | grep -E 'PlugIns/.+\.appex/' | head
          mkdir -p dist
          rm -f dist/BUILD-FAILED.txt
          cat > dist/BUILD-VERIFIED.txt <<EOF
          RJ Furz-App v2 build verified successfully.
          Widget extension embedded: yes ($APPEX_COUNT)
          Runner: macos-26
          $(xcodebuild -version | tr '\n' ' ')
          EOF

      - name: Save failure report
        if: failure()
        shell: bash
        run: |
          mkdir -p dist
          rm -f dist/BUILD-VERIFIED.txt
          {
            echo 'RJ Furz-App v2 build failed.'
            xcodebuild -version 2>/dev/null || true
            echo
            if [ -f RJ-FurzApp-v2-build.log ]; then
              grep -E '(^|[[:space:]])(error:|warning:)|SwiftCompile|CompileSwift' RJ-FurzApp-v2-build.log | tail -n 450 || true
            else
              echo 'Build log was not created.'
            fi
          } > dist/BUILD-FAILED.txt

      - name: Commit clean readable v2 source and result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .bootstrap Backend/__pycache__ Payload .github-derived
          git add -A
          git reset -- RJFurzApp.xcodeproj RJ-FurzApp-v2-build.log RJ-FurzApp-v2-unsigned.ipa 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Promote clean RJ Furz-App v2 source and build result [skip ci]'
            git push origin HEAD:main
          fi

      - name: Upload verified IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-FurzApp-v2-unsigned-IPA
          path: RJ-FurzApp-v2-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-FurzApp-v2-build-log
          path: RJ-FurzApp-v2-build.log
          if-no-files-found: ignore
          retention-days: 7
