name: Build RJ Furz-App 2.1 IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build verified unsigned iOS 2.1 IPA
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Validate app source
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint App/Info.plist
          plutil -lint Widget/Info.plist
          plutil -lint App/RJFurzApp.entitlements
          plutil -lint Widget/RJFurzWidget.entitlements
          test -f Widget/RJFurzWidgets.swift
          test -f App/FriendsHomeView.swift
          test -f App/PartnerViews.swift
          test -f App/AlarmService.swift
          test -f App/LocationViews.swift
          test -f App/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          grep -q 'Label("Freunde"' App/MainViews.swift
          grep -q 'StaticConfiguration' Widget/RJFurzWidgets.swift
          python3 -m py_compile Backend/rj_furz_backend.py
          rm -rf Backend/__pycache__

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version
          xcodegen generate --spec project.yml

      - name: Build unsigned app and widget
        shell: bash
        run: |
          set -o pipefail
          rm -rf .github-derived RJ-FurzApp-2.1-build.log
          xcodebuild \
            -project RJFurzApp.xcodeproj \
            -scheme RJFurzApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.github-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee RJ-FurzApp-2.1-build.log

      - name: Create and verify unsigned 2.1 IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$PWD/.github-derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$APP"
          test -d "$APP/PlugIns"
          APPEX="$(find "$APP/PlugIns" -maxdepth 1 -name '*.appex' -type d -print -quit)"
          test -n "$APPEX"
          test -f "$APPEX/Info.plist"
          test -d "$APPEX/Metadata.appintents"
          echo "Embedded widget extension: $APPEX"

          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry RJ-FurzApp-2.1-Friends-unsigned.ipa Payload
          unzip -t RJ-FurzApp-2.1-Friends-unsigned.ipa
          unzip -l RJ-FurzApp-2.1-Friends-unsigned.ipa | grep -E 'PlugIns/.+\.appex/' | head
          shasum -a 256 RJ-FurzApp-2.1-Friends-unsigned.ipa

      - name: Upload 2.1 IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-FurzApp-2.1-Friends-unsigned-IPA
          path: RJ-FurzApp-2.1-Friends-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-FurzApp-2.1-build-log
          path: RJ-FurzApp-2.1-build.log
          if-no-files-found: ignore
          retention-days: 7
