name: Package RJ Furz-App 2.1 Source

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create clean full source ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -qry RJ-Furz-App-2.1-Source.zip . \
            -x '.git/*' \
            -x '.github/workflows/package-source-21.yml' \
            -x 'RJ-Furz-App-2.1-Source.zip'
          unzip -t RJ-Furz-App-2.1-Source.zip
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RJ-Furz-App-2.1-Source
          path: RJ-Furz-App-2.1-Source.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
