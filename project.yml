name: RJFurzApp

options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    SWIFT_EMIT_LOC_STRINGS: YES

packages: {}

targets:
  RJFurzApp:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Resources
    resources:
      - path: App/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.rjuhas.furzapp
        PRODUCT_NAME: RJ Furz-App
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO

schemes:
  RJFurzApp:
    build:
      targets:
        RJFurzApp: all
    run:
      config: Debug
    archive:
      config: Release
