name: Bootstrap and Validate RJ Furz-App v2

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  PART07_SHA: d9c3c9e67f71a3ba950fe481adb3228796aa3dc5
  PART08_SHA: a8257e6e667996a2ddeae5b7161ae49b455a6a18
  PART09_SHA: 1b22dc44518eb66d79b6d794bfe33f397ba478f2
  PART10_SHA: 6b9cff9be8b5ca35da0c2939058b57c985c1d8a5
  PART11_SHA: b6df0f861a80cc9e7415ae5c5c873e006f23071e
  PART12_SHA: 531e1691acc5515cd501f1a967b6ad7a9d0bfd05
  PART13_SHA: 1025587eee30b0847649904768551bf2a9bf9bdf
  PART14_SHA: 298ef569290282d3c7a7739d055e1034fb3bf922

jobs:
  restore-build:
    name: Restore v2 source and build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct complete v2 source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          fetch_blob() {
            local sha="$1"
            local out="$2"
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" > /tmp/blob.json
            python3 - "$out" <<'PY'
          import base64, json, pathlib, sys
          data = json.loads(pathlib.Path('/tmp/blob.json').read_text())
          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(data['content']))
          PY
          }

          mkdir -p .bootstrap
          for n in 07 08 09 10 11 12 13 14; do
            key="PART${n}_SHA"
            fetch_blob "${!key}" ".bootstrap/part${n}"
          done

          for n in 00 01 02 03 04 05 06 07 08 09 10 11 12 13 14; do
            test -s ".bootstrap/part${n}"
          done

          python3 <<'PY'
          from pathlib import Path
          import base64, tarfile, zipfile, io, shutil

          parts = [Path(f'.bootstrap/part{i:02d}').read_bytes() for i in range(15)]
          joined = b''.join(parts)
          try:
              payload = base64.b64decode(b''.join(joined.split()), validate=True)
          except Exception as exc:
              raise SystemExit(f'Base64 reconstruction failed: {exc}')

          payload_path = Path('/tmp/rj-furz-v2.payload')
          payload_path.write_bytes(payload)
          out = Path('/tmp/rj-furz-v2-extracted')
          shutil.rmtree(out, ignore_errors=True)
          out.mkdir(parents=True)

          if tarfile.is_tarfile(payload_path):
              with tarfile.open(payload_path, 'r:*') as tf:
                  tf.extractall(out, filter='data')
          elif zipfile.is_zipfile(payload_path):
              with zipfile.ZipFile(payload_path) as zf:
                  zf.extractall(out)
          else:
              raise SystemExit('Reconstructed payload is neither TAR nor ZIP')

          projects = sorted(out.rglob('project.yml'), key=lambda p: len(p.parts))
          if not projects:
              raise SystemExit('project.yml missing from reconstructed source')
          root = projects[0].parent
          Path('/tmp/v2-root.txt').write_text(str(root))
          print(f'Restored source root: {root}')
          print(f'Files: {sum(1 for p in root.rglob("*") if p.is_file())}')
          PY

          SRC="$(cat /tmp/v2-root.txt)"
          rsync -a --delete --exclude='.git' "${SRC}/" "${GITHUB_WORKSPACE}/"
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-v2.yml

      - name: Install final manual build workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          cat > .github/workflows/build-ios.yml <<'YAML'
          name: Build RJ Furz-App v2 IPA

          on:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            build:
              name: Build unsigned iOS IPA
              runs-on: macos-26
              timeout-minutes: 30

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Select Xcode 26.5
                  shell: bash
                  run: |
                    set -euo pipefail
                    sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
                    xcodebuild -version
                    xcrun --sdk iphoneos --show-sdk-path

                - name: Install XcodeGen
                  shell: bash
                  run: |
                    set -euo pipefail
                    brew install xcodegen
                    xcodegen --version

                - name: Validate source
                  shell: bash
                  run: |
                    set -euo pipefail
                    plutil -lint App/Info.plist
                    find . -name '*.plist' -print0 | xargs -0 -n1 plutil -lint
                    python3 -m py_compile $(find . -name '*.py' -not -path './.git/*')
                    xcodegen generate --spec project.yml

                - name: Build unsigned app
                  shell: bash
                  run: |
                    set -o pipefail
                    rm -rf .github-derived
                    xcodebuild \
                      -project RJFurzApp.xcodeproj \
                      -scheme RJFurzApp \
                      -configuration Release \
                      -sdk iphoneos \
                      -destination 'generic/platform=iOS' \
                      -derivedDataPath "$PWD/.github-derived" \
                      CODE_SIGNING_ALLOWED=NO \
                      CODE_SIGNING_REQUIRED=NO \
                      CODE_SIGN_IDENTITY="" \
                      build 2>&1 | tee RJ-FurzApp-v2-build.log

                - name: Create and verify unsigned IPA
                  shell: bash
                  run: |
                    set -euo pipefail
                    APP="$(find "$PWD/.github-derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d -print -quit)"
                    test -n "$APP"
                    echo "Built app: $APP"
                    find "$APP" -maxdepth 4 -type d -name '*.appex' -print | tee /tmp/extensions.txt
                    test -s /tmp/extensions.txt
                    rm -rf Payload
                    mkdir -p Payload
                    cp -R "$APP" Payload/
                    /usr/bin/zip -qry RJ-FurzApp-v2-unsigned.ipa Payload
                    unzip -t RJ-FurzApp-v2-unsigned.ipa

                - name: Upload IPA
                  uses: actions/upload-artifact@v4
                  with:
                    name: RJ-FurzApp-v2-unsigned-IPA
                    path: RJ-FurzApp-v2-unsigned.ipa
                    if-no-files-found: error
                    retention-days: 7
                    compression-level: 0

                - name: Upload build log on failure
                  if: failure()
                  uses: actions/upload-artifact@v4
                  with:
                    name: RJ-FurzApp-v2-build-log
                    path: RJ-FurzApp-v2-build.log
                    if-no-files-found: ignore
                    retention-days: 7
          YAML

      - name: Commit reconstructed readable v2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Restore complete RJ Furz-App v2 source [skip ci]"
            git push origin HEAD:main
          fi

      - name: Select Xcode 26.5
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: Validate backend and project
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.plist' -print0 | xargs -0 -n1 plutil -lint
          PYFILES="$(find . -name '*.py' -not -path './.git/*' -print)"
          if [ -n "$PYFILES" ]; then python3 -m py_compile $PYFILES; fi
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Build unsigned v2 app and widget
        shell: bash
        run: |
          set -o pipefail
          rm -rf .github-derived
          xcodebuild \
            -project RJFurzApp.xcodeproj \
            -scheme RJFurzApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.github-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee RJ-FurzApp-v2-build.log

      - name: Package and verify unsigned v2 IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$PWD/.github-derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$APP"
          echo "Built app: $APP"
          find "$APP" -maxdepth 4 -type d -name '*.appex' -print | tee /tmp/extensions.txt
          test -s /tmp/extensions.txt
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry RJ-FurzApp-v2-unsigned.ipa Payload
          unzip -t RJ-FurzApp-v2-unsigned.ipa
          ls -lh RJ-FurzApp-v2-unsigned.ipa

      - name: Upload validated v2 IPA
        uses: actions/upload-artifact@v4
        with:
          name: RJ-FurzApp-v2-unsigned-IPA
          path: RJ-FurzApp-v2-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-FurzApp-v2-build-log
          path: RJ-FurzApp-v2-build.log
          if-no-files-found: ignore
          retention-days: 7
